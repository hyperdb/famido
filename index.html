<!DOCTYPE html>
<html lang="ja" data-theme="indigo">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Timeline Todo - Cloudflare D1 連携</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap');
    body { font-family: 'Inter', 'Noto Sans JP', sans-serif; }

    /* カラーテーマ定義 */
    :root, [data-theme="indigo"] {
      --bg-main: #f8fafc;
      --bg-card: #ffffff;
      --bg-subtle: #f1f5f9;
      --border-color: #e2e8f0;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --primary-light: #eef2ff;
      --primary-border: #c7d2fe;
      --timeline-line: #e2e8f0;
      --completed-card-bg: #f0fdf4;
      --completed-card-border: #bbf7d0;
      --completed-text: #166534;
      --completed-badge-bg: #dcfce7;
      --completed-badge-border: #86efac;
      --completed-badge-text: #166534;
    }

    [data-theme="amber"] {
      --bg-main: #fdfbf7;
      --bg-card: #ffffff;
      --bg-subtle: #fef3c7;
      --border-color: #f5ebe0;
      --text-main: #292524;
      --text-muted: #78716c;
      --primary: #d97706;
      --primary-hover: #b45309;
      --primary-light: #fffbeb;
      --primary-border: #fde68a;
      --timeline-line: #e7e5e4;
      --completed-card-bg: #fefce8;
      --completed-card-border: #fef08a;
      --completed-text: #854d0e;
      --completed-badge-bg: #fef9c3;
      --completed-badge-border: #fde047;
      --completed-badge-text: #854d0e;
    }

    [data-theme="emerald"] {
      --bg-main: #f6faf7;
      --bg-card: #ffffff;
      --bg-subtle: #d1fae5;
      --border-color: #e2ece5;
      --text-main: #064e3b;
      --text-muted: #047857;
      --primary: #059669;
      --primary-hover: #047857;
      --primary-light: #ecfdf5;
      --primary-border: #a7f3d0;
      --timeline-line: #d1e7dd;
      --completed-card-bg: #f0fdf4;
      --completed-card-border: #bbf7d0;
      --completed-text: #166534;
      --completed-badge-bg: #dcfce7;
      --completed-badge-border: #86efac;
      --completed-badge-text: #166534;
    }

    [data-theme="rose"] {
      --bg-main: #fdf8f9;
      --bg-card: #ffffff;
      --bg-subtle: #ffe4e6;
      --border-color: #fae4e8;
      --text-main: #4c0519;
      --text-muted: #9f1239;
      --primary: #e11d48;
      --primary-hover: #be123c;
      --primary-light: #fff1f2;
      --primary-border: #fecdd3;
      --timeline-line: #fbcfe8;
      --completed-card-bg: #fff1f2;
      --completed-card-border: #fecdd3;
      --completed-text: #9f1239;
      --completed-badge-bg: #ffe4e6;
      --completed-badge-border: #fda4af;
      --completed-badge-text: #9f1239;
    }

    [data-theme="dark"] {
      --bg-main: #0b0f19;
      --bg-card: #151d30;
      --bg-subtle: #1e293b;
      --border-color: #27354f;
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --primary: #6366f1;
      --primary-hover: #818cf8;
      --primary-light: #1e1b4b;
      --primary-border: #3730a3;
      --timeline-line: #2e3c54;
      --completed-card-bg: #09261a;
      --completed-card-border: #134e38;
      --completed-text: #34d399;
      --completed-badge-bg: #064e3b;
      --completed-badge-border: #059669;
      --completed-badge-text: #6ee7b7;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      transition: background-color 0.25s ease, color 0.25s ease;
    }

    .theme-card {
      background-color: var(--bg-card);
      border-color: var(--border-color);
    }

    .theme-primary-btn {
      background-color: var(--primary);
    }
    .theme-primary-btn:hover {
      background-color: var(--primary-hover);
    }

    .theme-primary-badge {
      background-color: var(--primary-light);
      border-color: var(--primary-border);
      color: var(--primary);
    }

    .theme-border {
      border-color: var(--border-color);
    }

    .theme-subtle-bg {
      background-color: var(--bg-subtle);
    }

    .theme-muted-text {
      color: var(--text-muted);
    }

    .theme-input {
      background-color: var(--bg-card);
      border-color: var(--border-color);
      color: var(--text-main);
    }

    .theme-timeline-line {
      background-color: var(--timeline-line);
    }

    .task-completed-card {
      background-color: var(--completed-card-bg) !important;
      border-color: var(--completed-card-border) !important;
    }

    .task-completed-badge {
      background-color: var(--completed-badge-bg) !important;
      border-color: var(--completed-badge-border) !important;
      color: var(--completed-badge-text) !important;
    }

    /* 日付入力（ピッカー）のタップ/クリック領域をバッジ全体に拡張 */
    .date-picker-input {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      cursor: pointer;
      font-size: 16px; /* iOS Safariでフォームズームを防ぐ */
      touch-action: manipulation;
    }
    .date-picker-input::-webkit-calendar-picker-indicator {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      cursor: pointer;
    }

    /* セレクトボックスのドロップダウン option の背景色・文字色（ダークモード対応） */
    select option {
      background-color: var(--bg-card) !important;
      color: var(--text-main) !important;
    }
  </style>
</head>
<body class="min-h-screen">

  <div class="max-w-5xl mx-auto px-4 py-8">
    <!-- ヘッダー -->
    <header class="theme-card rounded-2xl p-6 shadow-sm border mb-6 transition-colors">
      <div class="flex flex-col md:flex-row md:items-center justify-between gap-4">
        <div class="relative">
          <div class="flex items-center gap-2">
            <span class="theme-primary-badge px-2.5 py-0.5 rounded-full text-xs font-semibold border">プロジェクト</span>
            <!-- プロジェクト切り替えボタン -->
            <button onclick="toggleProjectMenu(event)" id="project-selector-btn"
              class="flex items-center gap-2 text-2xl font-bold hover:opacity-85 transition group text-left px-2 py-1 -ml-2 rounded-xl hover:bg-slate-100 dark:hover:bg-slate-800/60">
              <span id="project-title">🚚 新居への引越し</span>
              <i class="fa-solid fa-chevron-down text-sm opacity-50 group-hover:opacity-100 transition-transform duration-200" id="project-chevron"></i>
            </button>
          </div>
          <div class="flex items-center gap-3 mt-1.5 text-xs">
            <span id="api-status-badge" class="px-2 py-0.5 rounded-full font-medium bg-emerald-100 text-emerald-800 border border-emerald-300 flex items-center gap-1.5">
              <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
              Cloudflare D1 接続済
            </span>
            <span class="theme-muted-text">完了タスクもタイムライン上に履歴として保持されます</span>
          </div>

          <!-- プロジェクト切り替えドロップダウンメニュー -->
          <div id="project-dropdown" class="hidden absolute left-0 top-full mt-2 w-80 sm:w-96 theme-card rounded-2xl shadow-xl border theme-border z-50 p-2 transition-all">
            <div class="px-3 py-2 text-xs font-semibold theme-muted-text flex items-center justify-between border-b theme-border mb-1">
              <span><i class="fa-solid fa-folder-open mr-1"></i> プロジェクト一覧</span>
              <span id="project-count-badge" class="px-1.5 py-0.5 rounded bg-slate-100 dark:bg-slate-800 text-[10px]">1件</span>
            </div>
            
            <!-- プロジェクトリストコンテナ -->
            <div id="project-list-items" class="max-h-60 overflow-y-auto space-y-1 py-1">
              <!-- JSで動的レンダリング -->
            </div>

            <!-- アクションフッター -->
            <div class="pt-2 border-t theme-border mt-1 space-y-1">
              <button onclick="openNewProjectModal()" class="w-full px-3 py-2 text-left rounded-xl hover:bg-slate-100 dark:hover:bg-slate-800 text-xs font-semibold flex items-center gap-2 text-indigo-600 dark:text-indigo-400 transition">
                <i class="fa-solid fa-circle-plus text-sm"></i>
                新規プロジェクトを作成...
              </button>
            </div>
          </div>
        </div>

        <!-- メンバー & 操作者切替 & テーマ切替 & 進捗 -->
        <div class="flex flex-wrap items-center gap-4">
          <!-- 操作者（ログインユーザー擬似選択） -->
          <div class="flex items-center gap-1.5 bg-slate-100/70 dark:bg-slate-800/80 px-2.5 py-1.5 rounded-xl border theme-border" title="現在操作しているユーザー（実績記録者になります）">
            <span class="text-xs theme-muted-text flex items-center gap-1 font-medium">
              <i class="fa-regular fa-user"></i> あなた:
            </span>
            <select id="current-user-select" onchange="setCurrentUser(this.value)" class="bg-transparent text-xs font-bold theme-input border-0 focus:ring-0 p-0 cursor-pointer">
              <!-- 動的生成 -->
            </select>
          </div>

          <!-- テーマセレクター -->
          <div class="flex items-center gap-2 bg-slate-100/70 dark:bg-slate-800/80 px-3 py-1.5 rounded-xl border theme-border">
            <span class="text-xs theme-muted-text flex items-center gap-1 font-medium">
              <i class="fa-solid fa-palette"></i> テーマ:
            </span>
            <div class="flex items-center gap-1.5" id="theme-selector">
              <button onclick="changeTheme('indigo')" title="モダンインディゴ" class="w-5 h-5 rounded-full bg-indigo-600 ring-2 ring-offset-2 ring-indigo-500 transition-transform hover:scale-110" data-theme-btn="indigo"></button>
              <button onclick="changeTheme('amber')" title="ウォームアンバー" class="w-5 h-5 rounded-full bg-amber-500 hover:scale-110 transition-transform" data-theme-btn="amber"></button>
              <button onclick="changeTheme('emerald')" title="フォレストグリーン" class="w-5 h-5 rounded-full bg-emerald-600 hover:scale-110 transition-transform" data-theme-btn="emerald"></button>
              <button onclick="changeTheme('rose')" title="ブロッサムローズ" class="w-5 h-5 rounded-full bg-rose-500 hover:scale-110 transition-transform" data-theme-btn="rose"></button>
              <button onclick="changeTheme('dark')" title="ダークモード" class="w-5 h-5 rounded-full bg-slate-900 border border-slate-600 hover:scale-110 transition-transform flex items-center justify-center text-[10px] text-yellow-400" data-theme-btn="dark">
                <i class="fa-solid fa-moon"></i>
              </button>
            </div>
          </div>

          <!-- メンバーアバター -->
          <div id="members-list" class="flex items-center -space-x-2">
            <!-- 動的レンダリング -->
          </div>

          <!-- 進捗バー -->
          <div class="text-right">
            <div class="text-xs font-semibold theme-muted-text mb-1">進捗状況 (<span id="progress-text">0/0</span>)</div>
            <div class="w-28 bg-slate-200/70 rounded-full h-2.5 overflow-hidden">
              <div id="progress-bar" class="bg-emerald-500 h-2.5 rounded-full transition-all duration-300" style="width: 0%"></div>
            </div>
          </div>
        </div>
      </div>
    </header>

    <!-- タスク追加フォーム -->
    <div class="theme-card rounded-2xl p-4 shadow-sm border mb-6 transition-colors">
      <form id="add-task-form" class="space-y-3">
        <div class="flex flex-col sm:flex-row gap-2">
          <input type="text" id="task-title" placeholder="新しいタスクを入力... (例: ダンボールの手配、鍵の受取)" required
            class="theme-input flex-1 px-4 py-2 rounded-xl border focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm">
          <button type="submit" id="add-btn"
            class="theme-primary-btn text-white px-5 py-2 font-medium text-sm rounded-xl transition flex items-center justify-center gap-2 shadow-sm">
            <i class="fa-solid fa-plus"></i> タスク追加
          </button>
        </div>
        <div class="flex flex-wrap gap-2 text-xs">
          <!-- カテゴリー選択 -->
          <select id="task-category" class="theme-input px-3 py-1.5 rounded-lg border font-medium">
            <option value="cat_packing">📦 荷造り</option>
            <option value="cat_admin">📝 事務・手配</option>
            <option value="cat_clean">🧹 不用品・掃除</option>
          </select>
          <!-- 担当者選択 -->
          <select id="task-assignee" class="theme-input px-3 py-1.5 rounded-lg border font-medium">
            <option value="user_taro">👤 担当: 太郎</option>
            <option value="user_hanako">👤 担当: 花子</option>
            <option value="user_kenta">👤 担当: 健太</option>
            <option value="">👥 未定 / 全員</option>
          </select>
          <!-- 期限日 -->
          <input type="date" id="task-date" class="theme-input px-3 py-1.5 rounded-lg border">
          <!-- タグ入力 -->
          <input type="text" id="task-tags" placeholder="タグ (カンマ区切り: #急ぎ, #費用発生)" class="theme-input px-3 py-1.5 rounded-lg border flex-1 min-w-[160px]">
        </div>
      </form>
    </div>

    <!-- フィルターツールバー -->
    <div class="theme-card flex flex-wrap items-center justify-between gap-3 mb-6 p-3 rounded-xl border text-xs transition-colors">
      <div id="category-filter-container" class="flex flex-wrap items-center gap-2">
        <span class="font-semibold theme-muted-text mr-1"><i class="fa-solid fa-filter"></i> 絞り込み:</span>
        <button onclick="setFilter('category', 'all')" class="filter-cat-btn px-2.5 py-1 rounded-lg theme-primary-badge font-semibold border" data-val="all">すべて</button>
      </div>

      <div class="flex items-center gap-2">
        <!-- 担当者フィルター -->
        <select id="assignee-filter" onchange="setFilter('assignee', this.value)" class="theme-input px-2.5 py-1 rounded-lg border font-medium">
          <option value="all">担当者: 全員</option>
          <option value="太郎">太郎</option>
          <option value="花子">花子</option>
          <option value="健太">健太</option>
        </select>

        <!-- 表示切替（履歴含む / 未完了のみ / 完了ログのみ） -->
        <select id="view-mode-filter" onchange="setFilter('viewMode', this.value)" class="theme-input px-2.5 py-1 rounded-lg border font-medium">
          <option value="all">表示: タイムライン (完了履歴含む)</option>
          <option value="active-only">未完了タスクのみ</option>
          <option value="completed-only">完了実績ログのみ</option>
        </select>
      </div>
    </div>

    <!-- タイムラインエリア -->
    <div class="relative">
      <div class="theme-timeline-line absolute left-6 top-3 bottom-3 w-0.5"></div>
      <div id="timeline-list" class="space-y-4">
        <!-- JSで動的にレンダリング -->
      </div>
    </div>
  </div>

  <!-- 新規プロジェクト作成モーダル -->
  <div id="new-project-modal" class="hidden fixed inset-0 bg-black/60 backdrop-blur-xs z-50 flex items-center justify-center p-4">
    <div class="theme-card w-full max-w-md rounded-2xl p-6 shadow-2xl border theme-border transition-all">
      <div class="flex items-center justify-between mb-4">
        <h3 class="text-lg font-bold flex items-center gap-2">
          <i class="fa-solid fa-folder-plus text-indigo-500"></i> 新規プロジェクト作成
        </h3>
        <button onclick="closeNewProjectModal()" class="w-8 h-8 rounded-full hover:bg-slate-100 dark:hover:bg-slate-800 flex items-center justify-center theme-muted-text">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>

      <form id="new-project-form" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold theme-muted-text mb-1">プロジェクト名</label>
          <input type="text" id="new-proj-title" placeholder="例: ✈️ 年末の家族旅行、💻 新規事業" required
            class="theme-input w-full px-4 py-2.5 rounded-xl border focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm">
        </div>

        <div>
          <label class="block text-xs font-semibold theme-muted-text mb-1">説明 (任意)</label>
          <input type="text" id="new-proj-desc" placeholder="プロジェクトの目的や概要"
            class="theme-input w-full px-4 py-2 rounded-xl border focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm">
        </div>

        <div>
          <label class="block text-xs font-semibold theme-muted-text mb-1.5">テーマカラー</label>
          <div class="grid grid-cols-2 gap-2 text-xs">
            <label class="flex items-center gap-2 p-2 rounded-xl border theme-border cursor-pointer hover:bg-slate-50 dark:hover:bg-slate-800">
              <input type="radio" name="new-proj-theme" value="indigo" checked class="accent-indigo-600">
              <span>🔵 インディゴ</span>
            </label>
            <label class="flex items-center gap-2 p-2 rounded-xl border theme-border cursor-pointer hover:bg-slate-50 dark:hover:bg-slate-800">
              <input type="radio" name="new-proj-theme" value="amber" class="accent-amber-500">
              <span>🟠 アンバー</span>
            </label>
            <label class="flex items-center gap-2 p-2 rounded-xl border theme-border cursor-pointer hover:bg-slate-50 dark:hover:bg-slate-800">
              <input type="radio" name="new-proj-theme" value="emerald" class="accent-emerald-600">
              <span>🟢 グリーン</span>
            </label>
            <label class="flex items-center gap-2 p-2 rounded-xl border theme-border cursor-pointer hover:bg-slate-50 dark:hover:bg-slate-800">
              <input type="radio" name="new-proj-theme" value="rose" class="accent-rose-500">
              <span>🌸 ローズ</span>
            </label>
          </div>
        </div>

        <div class="flex items-center justify-end gap-2 pt-2">
          <button type="button" onclick="closeNewProjectModal()" class="px-4 py-2 rounded-xl text-xs font-medium hover:bg-slate-100 dark:hover:bg-slate-800">
            キャンセル
          </button>
          <button type="submit" id="create-proj-submit-btn" class="theme-primary-btn text-white px-5 py-2.5 rounded-xl text-xs font-semibold flex items-center gap-1.5">
            <i class="fa-solid fa-check"></i> 作成して開く
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- メンバー追加モーダル -->
  <div id="add-member-modal" class="hidden fixed inset-0 bg-black/60 backdrop-blur-xs z-50 flex items-center justify-center p-4">
    <div class="theme-card w-full max-w-sm rounded-2xl p-6 shadow-2xl border theme-border transition-all">
      <div class="flex items-center justify-between mb-4">
        <h3 class="text-lg font-bold flex items-center gap-2">
          <i class="fa-solid fa-user-plus text-indigo-500"></i> メンバーを追加
        </h3>
        <button onclick="closeAddMemberModal()" class="w-8 h-8 rounded-full hover:bg-slate-100 dark:hover:bg-slate-800 flex items-center justify-center theme-muted-text">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>

      <form id="add-member-form" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold theme-muted-text mb-1">名前 / ニックネーム</label>
          <input type="text" id="new-member-name" placeholder="例: 佐藤、パパ、業者A" required
            class="theme-input w-full px-4 py-2.5 rounded-xl border focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm">
        </div>

        <div>
          <label class="block text-xs font-semibold theme-muted-text mb-1">役割 (権限)</label>
          <select id="new-member-role" class="theme-input w-full px-3 py-2 rounded-xl border text-xs font-medium">
            <option value="member">メンバー (通常)</option>
            <option value="admin">管理者 (編集・設定)</option>
          </select>
        </div>

        <div>
          <label class="block text-xs font-semibold theme-muted-text mb-1.5">アバターカラー</label>
          <div class="flex items-center gap-3">
            <label class="flex items-center gap-1 cursor-pointer text-xs">
              <input type="radio" name="new-member-color" value="#2563eb" checked class="accent-blue-600">
              <span class="w-4 h-4 rounded-full bg-blue-600 inline-block"></span>
            </label>
            <label class="flex items-center gap-1 cursor-pointer text-xs">
              <input type="radio" name="new-member-color" value="#ec4899" class="accent-pink-500">
              <span class="w-4 h-4 rounded-full bg-pink-500 inline-block"></span>
            </label>
            <label class="flex items-center gap-1 cursor-pointer text-xs">
              <input type="radio" name="new-member-color" value="#0d9488" class="accent-teal-600">
              <span class="w-4 h-4 rounded-full bg-teal-600 inline-block"></span>
            </label>
            <label class="flex items-center gap-1 cursor-pointer text-xs">
              <input type="radio" name="new-member-color" value="#9333ea" class="accent-purple-600">
              <span class="w-4 h-4 rounded-full bg-purple-600 inline-block"></span>
            </label>
            <label class="flex items-center gap-1 cursor-pointer text-xs">
              <input type="radio" name="new-member-color" value="#ea580c" class="accent-orange-600">
              <span class="w-4 h-4 rounded-full bg-orange-600 inline-block"></span>
            </label>
          </div>
        </div>

        <div class="flex items-center justify-end gap-2 pt-2">
          <button type="button" onclick="closeAddMemberModal()" class="px-4 py-2 rounded-xl text-xs font-medium hover:bg-slate-100 dark:hover:bg-slate-800">
            キャンセル
          </button>
          <button type="submit" id="add-member-submit-btn" class="theme-primary-btn text-white px-5 py-2.5 rounded-xl text-xs font-semibold flex items-center gap-1.5">
            <i class="fa-solid fa-plus"></i> 追加する
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- メンバー編集モーダル -->
  <div id="edit-member-modal" class="hidden fixed inset-0 bg-black/60 backdrop-blur-xs z-50 flex items-center justify-center p-4">
    <div class="theme-card w-full max-w-sm rounded-2xl p-6 shadow-2xl border theme-border transition-all">
      <div class="flex items-center justify-between mb-4">
        <h3 class="text-lg font-bold flex items-center gap-2">
          <i class="fa-solid fa-user-pen text-indigo-500"></i> メンバー情報の編集
        </h3>
        <button onclick="closeEditMemberModal()" class="w-8 h-8 rounded-full hover:bg-slate-100 dark:hover:bg-slate-800 flex items-center justify-center theme-muted-text">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>

      <form id="edit-member-form" class="space-y-4">
        <input type="hidden" id="edit-member-id">
        <div>
          <label class="block text-xs font-semibold theme-muted-text mb-1">名前 / ニックネーム</label>
          <input type="text" id="edit-member-name" required
            class="theme-input w-full px-4 py-2.5 rounded-xl border focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm">
        </div>

        <div>
          <label class="block text-xs font-semibold theme-muted-text mb-1">役割</label>
          <select id="edit-member-role" class="theme-input w-full px-3 py-2 rounded-xl border text-xs font-medium">
            <option value="member">メンバー (通常)</option>
            <option value="admin">管理者 (編集・設定)</option>
            <option value="owner">オーナー</option>
          </select>
        </div>

        <div>
          <label class="block text-xs font-semibold theme-muted-text mb-1.5">アバターカラー</label>
          <div class="flex items-center gap-3">
            <label class="flex items-center gap-1 cursor-pointer text-xs">
              <input type="radio" name="edit-member-color" value="#2563eb" class="accent-blue-600">
              <span class="w-4 h-4 rounded-full bg-blue-600 inline-block"></span>
            </label>
            <label class="flex items-center gap-1 cursor-pointer text-xs">
              <input type="radio" name="edit-member-color" value="#ec4899" class="accent-pink-500">
              <span class="w-4 h-4 rounded-full bg-pink-500 inline-block"></span>
            </label>
            <label class="flex items-center gap-1 cursor-pointer text-xs">
              <input type="radio" name="edit-member-color" value="#0d9488" class="accent-teal-600">
              <span class="w-4 h-4 rounded-full bg-teal-600 inline-block"></span>
            </label>
            <label class="flex items-center gap-1 cursor-pointer text-xs">
              <input type="radio" name="edit-member-color" value="#9333ea" class="accent-purple-600">
              <span class="w-4 h-4 rounded-full bg-purple-600 inline-block"></span>
            </label>
            <label class="flex items-center gap-1 cursor-pointer text-xs">
              <input type="radio" name="edit-member-color" value="#ea580c" class="accent-orange-600">
              <span class="w-4 h-4 rounded-full bg-orange-600 inline-block"></span>
            </label>
          </div>
        </div>

        <div class="flex items-center justify-end gap-2 pt-2">
          <button type="button" onclick="closeEditMemberModal()" class="px-4 py-2 rounded-xl text-xs font-medium hover:bg-slate-100 dark:hover:bg-slate-800">
            キャンセル
          </button>
          <button type="submit" id="edit-member-submit-btn" class="theme-primary-btn text-white px-5 py-2.5 rounded-xl text-xs font-semibold flex items-center gap-1.5">
            <i class="fa-solid fa-check"></i> 更新する
          </button>
        </div>
      </form>
    </div>
  </div>

  <script>
    const API_BASE = 'http://127.0.0.1:8787/api';
    let currentProjectId = localStorage.getItem('timeline_current_project') || 'proj_moving';
    let currentUserId = localStorage.getItem('timeline_current_user') || 'user_taro';

    let allProjects = [];
    let projectData = null;
    let tasks = [];
    let categories = [];
    let members = [];
    let isApiConnected = false;

    let filters = { category: 'all', assignee: 'all', viewMode: 'all' };

    // 操作ユーザー切り替え
    function setCurrentUser(userId) {
      currentUserId = userId;
      localStorage.setItem('timeline_current_user', userId);
    }

    function openAddMemberModal() {
      document.getElementById('add-member-modal').classList.remove('hidden');
      document.getElementById('new-member-name').focus();
    }

    function closeAddMemberModal() {
      document.getElementById('add-member-modal').classList.add('hidden');
      document.getElementById('add-member-form').reset();
    }

    // カテゴリーのスタイル定義
    const defaultCategoryStyles = {
      "荷造り": { bg: "bg-amber-100 text-amber-800 border-amber-300", icon: "📦" },
      "事務・手配": { bg: "bg-blue-100 text-blue-800 border-blue-300", icon: "📝" },
      "不用品・掃除": { bg: "bg-purple-100 text-purple-800 border-purple-300", icon: "🧹" }
    };

    // プロジェクトメニューの開閉
    function toggleProjectMenu(e, force) {
      if (e) e.stopPropagation();
      const menu = document.getElementById('project-dropdown');
      const chevron = document.getElementById('project-chevron');
      const isOpen = force !== undefined ? force : menu.classList.contains('hidden');

      if (isOpen) {
        menu.classList.remove('hidden');
        chevron.classList.add('rotate-180');
        fetchProjects(); // 最新のプロジェクト一覧と進捗を取得
      } else {
        menu.classList.add('hidden');
        chevron.classList.remove('rotate-180');
      }
    }

    // 画面外クリックでメニューを閉じる
    document.addEventListener('click', (e) => {
      const menu = document.getElementById('project-dropdown');
      const btn = document.getElementById('project-selector-btn');
      if (menu && !menu.contains(e.target) && !btn.contains(e.target)) {
        menu.classList.add('hidden');
        const chevron = document.getElementById('project-chevron');
        if (chevron) chevron.classList.remove('rotate-180');
      }
    });

    // プロジェクト一覧の取得＆ドロップダウン描画
    async function fetchProjects() {
      if (!isApiConnected) {
        allProjects = [
          { id: 'proj_moving', title: '🚚 新居への引越し', task_count: tasks.length, completed_task_count: tasks.filter(t=>t.is_completed).length }
        ];
        renderProjectDropdown();
        return;
      }
      try {
        const res = await fetch(`${API_BASE}/projects`);
        if (res.ok) {
          allProjects = await res.json();
          renderProjectDropdown();
        }
      } catch (e) {
        console.error('Failed to fetch projects', e);
      }
    }

    function renderProjectDropdown() {
      const container = document.getElementById('project-list-items');
      const badge = document.getElementById('project-count-badge');
      if (badge) badge.innerText = `${allProjects.length}件`;

      container.innerHTML = allProjects.map(p => {
        const isCurrent = p.id === currentProjectId;
        const total = p.task_count || 0;
        const completed = p.completed_task_count || 0;
        const pct = total === 0 ? 0 : Math.round((completed / total) * 100);

        return `
          <button onclick="switchProject('${p.id}')"
            class="w-full text-left p-2.5 rounded-xl transition flex items-center justify-between gap-3 ${isCurrent ? 'bg-indigo-50/80 dark:bg-indigo-950/40 border border-indigo-200 dark:border-indigo-800' : 'hover:bg-slate-100 dark:hover:bg-slate-800'}">
            <div class="flex-1 min-w-0">
              <div class="flex items-center gap-1.5 font-bold text-xs truncate">
                <span>${p.title}</span>
                ${isCurrent ? '<i class="fa-solid fa-circle-check text-indigo-600 dark:text-indigo-400 text-xs ml-1"></i>' : ''}
              </div>
              <div class="flex items-center gap-2 mt-1">
                <div class="w-20 bg-slate-200 dark:bg-slate-700 h-1.5 rounded-full overflow-hidden">
                  <div class="bg-emerald-500 h-1.5 rounded-full" style="width: ${pct}%"></div>
                </div>
                <span class="text-[10px] theme-muted-text">${completed}/${total} 完了 (${pct}%)</span>
              </div>
            </div>
            ${isCurrent ? '<span class="text-[10px] font-semibold text-indigo-600 dark:text-indigo-400 px-1.5 py-0.5 rounded bg-indigo-100 dark:bg-indigo-900/60">選択中</span>' : ''}
          </button>
        `;
      }).join('');
    }

    // プロジェクト切り替え
    async function switchProject(projectId) {
      currentProjectId = projectId;
      localStorage.setItem('timeline_current_project', projectId);
      toggleProjectMenu(null, false);

      const target = allProjects.find(p => p.id === projectId);
      if (target && target.theme) {
        changeTheme(target.theme, false); // プロジェクト切り替え時はDB再保存スキップ
      }

      await loadData(projectId);
    }

    function openNewProjectModal() {
      toggleProjectMenu(null, false);
      document.getElementById('new-project-modal').classList.remove('hidden');
      document.getElementById('new-proj-title').focus();
    }

    function closeNewProjectModal() {
      document.getElementById('new-project-modal').classList.add('hidden');
      document.getElementById('new-project-form').reset();
    }

    // 新規プロジェクト作成フォーム送信
    document.getElementById('new-project-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const title = document.getElementById('new-proj-title').value.trim();
      const desc = document.getElementById('new-proj-desc').value.trim();
      const theme = document.querySelector('input[name="new-proj-theme"]:checked')?.value || 'indigo';

      if (!title) return;

      const submitBtn = document.getElementById('create-proj-submit-btn');
      submitBtn.disabled = true;

      try {
        if (isApiConnected) {
          const res = await fetch(`${API_BASE}/projects`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ title, description: desc, theme, userId: 'user_taro' })
          });
          const data = await res.json();
          if (data.success && data.projectId) {
            closeNewProjectModal();
            changeTheme(theme);
            await fetchProjects();
            await switchProject(data.projectId);
          }
        } else {
          // スタンドアロンモック
          const mockId = 'proj_' + Date.now();
          allProjects.push({ id: mockId, title, task_count: 0, completed_task_count: 0, theme });
          closeNewProjectModal();
          changeTheme(theme);
          await switchProject(mockId);
        }
      } catch (err) {
        console.error('Create project failed', err);
        alert('プロジェクトの作成に失敗しました: ' + err.message);
      } finally {
        submitBtn.disabled = false;
      }
    });

    // 初期化ロード
    async function loadData(projId = currentProjectId) {
      try {
        const res = await fetch(`${API_BASE}/projects/${projId}`);
        if (!res.ok) {
          // もし指定のプロジェクトが存在しない場合はデフォルト引越しプロジェクトへフォールバック
          if (projId !== 'proj_moving') {
            return switchProject('proj_moving');
          }
          throw new Error('API fetch error');
        }
        const data = await res.json();
        
        isApiConnected = true;
        projectData = data.project;
        tasks = data.tasks;
        categories = data.categories;
        members = data.members;

        // プロジェクト固有のテーマを復元
        if (projectData && projectData.theme) {
          changeTheme(projectData.theme, false);
        }

        renderProjectInfo();
        renderFilters();
        render();
        fetchProjects(); // プロジェクト一覧も更新
      } catch (e) {
        console.warn('API connection failed, falling back to local demo:', e);
        isApiConnected = false;
        document.getElementById('api-status-badge').className = "px-2 py-0.5 rounded-full font-medium bg-amber-100 text-amber-800 border border-amber-300 flex items-center gap-1.5";
        document.getElementById('api-status-badge').innerHTML = '<span class="w-2 h-2 rounded-full bg-amber-500"></span> ローカルスタンドアロン';
      }
    }

    function renderProjectInfo() {
      if (!projectData) return;
      document.getElementById('project-title').innerText = projectData.title;

      // メンバーアバター描画（クリックで情報編集）
      const container = document.getElementById('members-list');
      container.innerHTML = members.map(m => `
        <button onclick="openEditMemberModal('${m.id}')"
             class="w-9 h-9 rounded-full text-white flex items-center justify-center font-bold text-xs ring-2 ring-white shadow-sm hover:scale-110 hover:ring-indigo-300 transition-all cursor-pointer"
             style="background-color: ${m.avatar_color || '#4f46e5'}" title="${m.name} (${m.role}) - クリックして編集">
          ${m.name}
        </button>
      `).join('') + `
        <button onclick="openAddMemberModal()" class="w-9 h-9 rounded-full bg-slate-200 text-slate-700 flex items-center justify-center font-bold text-xs ring-2 ring-white hover:bg-indigo-600 hover:text-white transition shadow-sm" title="メンバーを追加">+</button>
      `;

      // 操作ユーザーセレクター更新
      const userSelect = document.getElementById('current-user-select');
      if (userSelect && members.length > 0) {
        // もし現在選択中のIDが参加メンバーになければ先頭のメンバーを選択
        if (!members.some(m => m.id === currentUserId)) {
          currentUserId = members[0].id;
          localStorage.setItem('timeline_current_user', currentUserId);
        }
        userSelect.innerHTML = members.map(m => `
          <option value="${m.id}" ${m.id === currentUserId ? 'selected' : ''}>${m.name}</option>
        `).join('');
      }

      // カテゴリーセレクトボックス更新
      const catSelect = document.getElementById('task-category');
      catSelect.innerHTML = categories.map(c => `
        <option value="${c.id}">${c.icon} ${c.name}</option>
      `).join('');

      // 担当者セレクトボックス更新
      const assignSelect = document.getElementById('task-assignee');
      assignSelect.innerHTML = members.map(m => `
        <option value="${m.id}">👤 担当: ${m.name}</option>
      `).join('') + `<option value="">👥 未定 / 全員</option>`;

      // 担当者フィルター更新
      const filterAssignee = document.getElementById('assignee-filter');
      if (filterAssignee) {
        filterAssignee.innerHTML = `<option value="all">担当者: 全員</option>` + members.map(m => `
          <option value="${m.name}" ${filters.assignee === m.name ? 'selected' : ''}>${m.name}</option>
        `).join('');
      }
    }

    function renderFilters() {
      const container = document.getElementById('category-filter-container');
      let html = `<span class="font-semibold theme-muted-text mr-1"><i class="fa-solid fa-filter"></i> 絞り込み:</span>`;
      html += `<button onclick="setFilter('category', 'all')" class="filter-cat-btn px-2.5 py-1 rounded-lg ${filters.category === 'all' ? 'theme-primary-badge font-semibold border' : 'theme-muted-text hover:bg-slate-100'}" data-val="all">すべて</button>`;
      
      categories.forEach(c => {
        const isActive = filters.category === c.name;
        html += `<button onclick="setFilter('category', '${c.name}')" class="filter-cat-btn px-2.5 py-1 rounded-lg ${isActive ? 'theme-primary-badge font-semibold border' : 'theme-muted-text hover:bg-slate-100'}" data-val="${c.name}">${c.icon} ${c.name}</button>`;
      });
      container.innerHTML = html;
    }

    async function changeTheme(themeName, persistToProject = true) {
      document.documentElement.setAttribute('data-theme', themeName);
      localStorage.setItem('timeline_todo_theme', themeName);

      document.querySelectorAll('#theme-selector button').forEach(btn => {
        if (btn.getAttribute('data-theme-btn') === themeName) {
          btn.classList.add('ring-2', 'ring-offset-2', 'ring-indigo-400');
        } else {
          btn.classList.remove('ring-2', 'ring-offset-2', 'ring-indigo-400');
        }
      });

      // 現在のプロジェクトのテーマ設定を更新
      if (allProjects && currentProjectId) {
        const p = allProjects.find(item => item.id === currentProjectId);
        if (p) p.theme = themeName;
      }
      if (projectData) {
        projectData.theme = themeName;
      }

      // 右上のテーマセレクターから手動変更した場合は、プロジェクトのテーマ設定としてDBにも即時保存！
      if (persistToProject && isApiConnected && currentProjectId) {
        try {
          await fetch(`${API_BASE}/projects/${currentProjectId}/theme`, {
            method: 'PATCH',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ theme: themeName })
          });
        } catch (e) {
          console.error('Failed to update project theme in DB:', e);
        }
      }

      render();
    }

    const savedTheme = localStorage.getItem('timeline_todo_theme') || 'indigo';
    changeTheme(savedTheme);

    function setFilter(type, val) {
      filters[type] = val;
      renderFilters();
      render();
    }

    async function toggleTask(id) {
      const task = tasks.find(t => t.id === id);
      if (!task) return;

      const previousStatus = task.is_completed;
      const currentUser = members.find(m => m.id === currentUserId) || { name: 'あなた' };

      // 楽観的UI更新
      task.is_completed = !task.is_completed;
      if (task.is_completed) {
        const now = new Date();
        task.completed_at = `${now.getMonth()+1}/${now.getDate()} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
        task.completed_by_name = currentUser.name;
      } else {
        task.completed_at = null;
        task.completed_by_name = null;
      }
      render();

      if (isApiConnected) {
        try {
          const res = await fetch(`${API_BASE}/tasks/${id}/toggle`, {
            method: 'PATCH',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ userId: currentUserId })
          });
          if (!res.ok) throw new Error('Toggle failed');
        } catch (e) {
          console.error('API toggle error:', e);
          task.is_completed = previousStatus;
          render();
        }
      }
    }

    // タスクの期限変更（リスケジュール、完了済みは不可）
    async function rescheduleTask(taskId, newDate) {
      const task = tasks.find(t => t.id === taskId);
      if (!task) return;
      if (task.is_completed) {
        alert("完了済みのタスクは期限を変更できません。");
        return;
      }

      const previousDueDate = task.due_date || task.dueDate;
      task.due_date = newDate;
      task.dueDate = newDate;

      // 日付順に再ソート
      tasks.sort((a, b) => {
        const dateA = a.due_date || a.dueDate || '9999-99-99';
        const dateB = b.due_date || b.dueDate || '9999-99-99';
        return dateA.localeCompare(dateB);
      });
      render();

      if (isApiConnected) {
        try {
          const res = await fetch(`${API_BASE}/tasks/${taskId}/due-date`, {
            method: 'PATCH',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ dueDate: newDate })
          });
          if (!res.ok) {
            const err = await res.json();
            throw new Error(err.error || 'Reschedule failed');
          }
        } catch (e) {
          console.error('Reschedule error:', e);
          alert('期限の更新に失敗しました: ' + e.message);
          task.due_date = previousDueDate;
          task.dueDate = previousDueDate;
          render();
        }
      }
    }

    // タスクの担当者変更（未完了のみ、完了済みは不可）
    async function changeTaskAssignee(taskId, newAssigneeId) {
      const task = tasks.find(t => t.id === taskId);
      if (!task) return;
      if (task.is_completed) {
        alert("完了済みのタスクは担当者を変更できません。");
        return;
      }

      const previousAssigneeId = task.assignee_id;
      const previousAssigneeName = task.assignee_name;
      const previousAssigneeColor = task.assignee_color;

      const targetMember = members.find(m => m.id === newAssigneeId);
      task.assignee_id = newAssigneeId || null;
      task.assignee_name = targetMember ? targetMember.name : '未定';
      task.assignee_color = targetMember ? (targetMember.avatar_color || '#64748b') : '#64748b';
      render();

      if (isApiConnected) {
        try {
          const res = await fetch(`${API_BASE}/tasks/${taskId}/assignee`, {
            method: 'PATCH',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ assigneeId: newAssigneeId || null })
          });
          if (!res.ok) {
            const err = await res.json();
            throw new Error(err.error || 'Failed to update assignee');
          }
        } catch (e) {
          console.error('Assignee update error:', e);
          alert('担当者の更新に失敗しました: ' + e.message);
          task.assignee_id = previousAssigneeId;
          task.assignee_name = previousAssigneeName;
          task.assignee_color = previousAssigneeColor;
          render();
        }
      }
    }

    function render() {
      const container = document.getElementById('timeline-list');
      container.innerHTML = '';

      const filtered = tasks.filter(t => {
        const catName = t.category_name || t.category;
        const assignName = t.assignee_name || t.assignee;
        if (filters.category !== 'all' && catName !== filters.category) return false;
        if (filters.assignee !== 'all' && assignName !== filters.assignee && assignName !== '全員') return false;
        if (filters.viewMode === 'active-only' && t.is_completed) return false;
        if (filters.viewMode === 'completed-only' && !t.is_completed) return false;
        return true;
      });

      const total = tasks.length;
      const completedCount = tasks.filter(t => t.is_completed).length;
      const pct = total === 0 ? 0 : Math.round((completedCount / total) * 100);
      document.getElementById('progress-bar').style.width = pct + '%';
      document.getElementById('progress-text').innerText = `${completedCount}/${total} 完了 (${pct}%)`;

      if (filtered.length === 0) {
        container.innerHTML = `
          <div class="text-center py-12 theme-muted-text text-sm">
            <i class="fa-regular fa-folder-open text-3xl mb-2 block"></i>
            条件に一致するタスクはありません
          </div>
        `;
        return;
      }

      filtered.forEach(task => {
        const catName = task.category_name || task.category || '一般';
        const catIcon = task.category_icon || '📌';
        const catStyle = defaultCategoryStyles[catName] || { bg: "bg-slate-100 text-slate-700 border-slate-300", icon: catIcon };
        const assigneeName = task.assignee_name || task.assignee || '未定';
        const assigneeColor = task.assignee_color || '#64748b';

        const item = document.createElement('div');
        item.className = "relative pl-12 transition-all duration-200";

        // タイムラインの丸アイコン
        const iconNode = task.is_completed
          ? `<div class="absolute left-4 top-4 w-4 h-4 rounded-full bg-emerald-500 ring-4 ring-offset-0 ring-emerald-200/40 flex items-center justify-center text-[10px] text-white font-bold">✓</div>`
          : `<div class="absolute left-4 top-4 w-4 h-4 rounded-full bg-white border-2 border-indigo-500 ring-4 ring-slate-100"></div>`;

        // 完了状態に応じたカードスタイル（消さずに残す！）
        const cardStyle = task.is_completed
          ? "task-completed-card shadow-none opacity-85"
          : "theme-card shadow-sm hover:border-indigo-300";

        const titleStyle = task.is_completed
          ? "line-through text-slate-500 dark:text-slate-400 font-normal"
          : "font-semibold";

        const currentDueDate = task.due_date || task.dueDate || '';

        // 期限バッジ：完了済みは変更不可ロック、未完了はバッジ全体がタップ・クリック可能なカレンダートリガー
        const badgeHtml = task.is_completed
          ? `<span class="task-completed-badge px-2.5 py-1 rounded-lg text-[11px] font-medium border flex items-center gap-1 cursor-default select-none opacity-90" title="完了済みのため期限変更不可（実績ロック）">
               <i class="fa-solid fa-check-double text-[10px]"></i>
               実績: ${task.completed_by_name ? task.completed_by_name + 'が完了' : '完了'} (${task.completed_at ? task.completed_at.substring(5, 16) : ''})
             </span>`
          : `<label class="relative inline-flex items-center group cursor-pointer select-none active:scale-95 transition-transform"
               title="タップして期限を変更（カレンダー入力）"
               onclick="try{ this.querySelector('input').showPicker(); }catch(e){}">
               <span class="theme-subtle-bg theme-muted-text px-2.5 py-1 rounded-lg text-[11px] font-medium border theme-border flex items-center gap-1.5 transition group-hover:border-indigo-400 group-hover:text-indigo-600 shadow-2xs">
                 <i class="fa-regular fa-calendar text-xs text-indigo-500/80"></i>
                 <span>期限: ${currentDueDate || '未設定'}</span>
                 <i class="fa-solid fa-pen-to-square text-[10px] opacity-40 group-hover:opacity-100 transition"></i>
               </span>
               <input type="date" value="${currentDueDate}"
                 class="date-picker-input"
                 title="タップして期限を変更"
                 onchange="rescheduleTask('${task.id}', this.value)"
               />
             </label>`;

        item.innerHTML = `
          ${iconNode}
          <div class="rounded-2xl p-4 border ${cardStyle} transition-all">
            <div class="flex items-start justify-between gap-3">
              <div class="flex items-start gap-3 flex-1">
                <button onclick="toggleTask('${task.id}')" class="mt-0.5 text-lg transition ${task.is_completed ? 'text-emerald-600 dark:text-emerald-400' : 'text-slate-300 hover:text-indigo-600'}">
                  <i class="${task.is_completed ? 'fa-solid fa-circle-check' : 'fa-regular fa-circle'}"></i>
                </button>
                <div class="space-y-1.5 flex-1">
                  <div class="flex flex-wrap items-center gap-2">
                    <span class="text-sm ${titleStyle}">${task.title}</span>
                  </div>
                  <div class="flex flex-wrap items-center gap-2 text-xs">
                    <!-- カテゴリーバッジ -->
                    <span class="px-2 py-0.5 rounded-full border text-[11px] font-medium ${catStyle.bg}">
                      ${catIcon} ${catName}
                    </span>
                    <!-- 担当者バッジ（未完了ならクリックで変更可能、完了済みならロック） -->
                    ${task.is_completed
                      ? `<span class="px-2.5 py-1 rounded-lg border text-[11px] font-medium border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-slate-600 dark:text-slate-400 flex items-center gap-1.5 select-none opacity-85" title="完了済みのため担当者変更不可（実績ロック）">
                          <span class="w-2 h-2 rounded-full inline-block" style="background-color: ${assigneeColor}"></span>
                          <span>${assigneeName}</span>
                        </span>`
                      : `<label class="relative inline-flex items-center group cursor-pointer select-none active:scale-95 transition-transform" title="タップして担当者を変更">
                          <span class="px-2.5 py-1 rounded-lg border text-[11px] font-medium border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-slate-700 dark:text-slate-300 flex items-center gap-1.5 transition group-hover:border-indigo-400 group-hover:text-indigo-600 shadow-2xs">
                            <span class="w-2 h-2 rounded-full inline-block" style="background-color: ${assigneeColor}"></span>
                            <span>${assigneeName}</span>
                            <i class="fa-solid fa-pen-to-square text-[9px] opacity-40 group-hover:opacity-100 transition"></i>
                          </span>
                          <select class="absolute inset-0 opacity-0 cursor-pointer w-full h-full text-base"
                            onchange="changeTaskAssignee('${task.id}', this.value)"
                            title="タップして担当者を変更">
                            <option value="">未定 / 全員</option>
                            ${members.map(m => `<option value="${m.id}" ${m.id === task.assignee_id ? 'selected' : ''}>👤 ${m.name}</option>`).join('')}
                          </select>
                        </label>`}
                    <!-- 期限または完了日時バッジ -->
                    ${badgeHtml}
                    <!-- タグ -->
                    ${(task.tags || []).map(tag => `<span class="theme-subtle-bg theme-muted-text px-1.5 py-0.5 rounded text-[10px] border theme-border">#${tag.replace('#','')}</span>`).join('')}
                  </div>
                </div>
              </div>
            </div>
          </div>
        `;
        container.appendChild(item);
      });
    }

    // フォーム送信
    document.getElementById('add-task-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const title = document.getElementById('task-title').value.trim();
      if (!title) return;

      const categoryId = document.getElementById('task-category').value;
      const assigneeId = document.getElementById('task-assignee').value || null;
      const dueDate = document.getElementById('task-date').value || new Date().toISOString().split('T')[0];
      const tagStr = document.getElementById('task-tags').value;
      const tags = tagStr ? tagStr.split(',').map(s => s.trim().replace(/^#/, '')).filter(Boolean) : [];

      const submitBtn = document.getElementById('add-btn');
      submitBtn.disabled = true;

      if (isApiConnected) {
        try {
          const res = await fetch(`${API_BASE}/tasks`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              projectId: currentProjectId,
              title,
              categoryId,
              assigneeId,
              dueDate,
              tags
            })
          });
          if (res.ok) {
            document.getElementById('task-title').value = '';
            document.getElementById('task-tags').value = '';
            await loadData(); // サーバーから最新取得
          }
        } catch (err) {
          console.error('Task creation failed:', err);
        } finally {
          submitBtn.disabled = false;
        }
      } else {
        // ローカルデモフォールバック
        tasks.push({
          id: 'task_' + Date.now(),
          title,
          category_name: categories.find(c => c.id === categoryId)?.name || '荷造り',
          category_icon: '📦',
          assignee_name: members.find(m => m.id === assigneeId)?.name || '未定',
          due_date: dueDate,
          is_completed: false,
          completed_at: null,
          tags
        });
        document.getElementById('task-title').value = '';
        document.getElementById('task-tags').value = '';
        submitBtn.disabled = false;
        render();
      }
    });

    // メンバー追加フォーム送信
    document.getElementById('add-member-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const name = document.getElementById('new-member-name').value.trim();
      const role = document.getElementById('new-member-role').value;
      const color = document.querySelector('input[name="new-member-color"]:checked')?.value || '#2563eb';

      if (!name) return;

      const submitBtn = document.getElementById('add-member-submit-btn');
      submitBtn.disabled = true;

      try {
        if (isApiConnected) {
          const res = await fetch(`${API_BASE}/projects/${currentProjectId}/members`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name, role, avatarColor: color })
          });
          const data = await res.json();
          if (data.success) {
            closeAddMemberModal();
            await loadData(currentProjectId);
          }
        } else {
          members.push({ id: 'user_' + Date.now(), name, role, avatar_color: color });
          closeAddMemberModal();
          renderProjectInfo();
        }
      } catch (err) {
        console.error('Failed to add member', err);
        alert('メンバー追加に失敗しました: ' + err.message);
      } finally {
        submitBtn.disabled = false;
      }
    });

    // メンバー編集モーダルの開閉と保存
    function openEditMemberModal(userId) {
      const member = members.find(m => m.id === userId);
      if (!member) return;

      document.getElementById('edit-member-id').value = member.id;
      document.getElementById('edit-member-name').value = member.name;
      document.getElementById('edit-member-role').value = member.role || 'member';

      const colorRadios = document.querySelectorAll('input[name="edit-member-color"]');
      colorRadios.forEach(r => {
        r.checked = (r.value.toLowerCase() === (member.avatar_color || '#2563eb').toLowerCase());
      });

      document.getElementById('edit-member-modal').classList.remove('hidden');
      document.getElementById('edit-member-name').focus();
    }

    function closeEditMemberModal() {
      document.getElementById('edit-member-modal').classList.add('hidden');
      document.getElementById('edit-member-form').reset();
    }

    document.getElementById('edit-member-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const userId = document.getElementById('edit-member-id').value;
      const name = document.getElementById('edit-member-name').value.trim();
      const role = document.getElementById('edit-member-role').value;
      const color = document.querySelector('input[name="edit-member-color"]:checked')?.value || '#2563eb';

      if (!name) return;

      const submitBtn = document.getElementById('edit-member-submit-btn');
      submitBtn.disabled = true;

      try {
        if (isApiConnected) {
          const res = await fetch(`${API_BASE}/users/${userId}`, {
            method: 'PATCH',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name, role, avatarColor: color, projectId: currentProjectId })
          });
          const data = await res.json();
          if (data.success) {
            closeEditMemberModal();
            await loadData(currentProjectId);
          }
        } else {
          const m = members.find(item => item.id === userId);
          if (m) {
            m.name = name;
            m.role = role;
            m.avatar_color = color;
          }
          closeEditMemberModal();
          renderProjectInfo();
          render();
        }
      } catch (err) {
        console.error('Failed to update member:', err);
        alert('メンバー情報の更新に失敗しました: ' + err.message);
      } finally {
        submitBtn.disabled = false;
      }
    });

    // 初期化
    document.getElementById('task-date').value = new Date().toISOString().split('T')[0];
    loadData();
  </script>
</body>
</html>
